name: Deploy customer portal demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portal-demo/**"
      - ".github/workflows/deploy-portal-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-portal-demo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal-demo
      - id: deployment
        uses: actions/deploy-pages@v4
